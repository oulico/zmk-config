# Core Bluetooth settings
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# TX power: 0dBm (default). +8 was overkill for desk range and drained battery.
# Increase to CONFIG_BT_CTLR_TX_PWR_PLUS_8=y only if connection is unstable.
CONFIG_BT_CTLR_TX_PWR_0=y

# Split keyboard support
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

# Idle → sleep transition timings
# 60s 무입력 → idle (display/LED off), 5min 무입력 → deep sleep (BT 끊김, ~20uA)
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
# 배터리 레벨 폴링 5분마다 (기본 60s → BLE 트래픽 감소)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Mouse/Pointing device support
CONFIG_ZMK_POINTING=y

# Connection stability improvements
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# BLE connection latency: slave latency 0 = 매 인터벌(7.5ms)마다 즉시 응답
# 기본값 30은 최대 225ms 지연 유발. 배터리 소모 소폭 증가하나 타이핑 응답성 대폭 개선.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ZMK Studio (USB 연결 시 브라우저에서 실시간 키맵 편집)
CONFIG_ZMK_STUDIO=y

# Settings persistence
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=30000

# Combo support
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

# Performance optimization for homerow mods
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Central (left) specific
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# Peripheral battery level proxy
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
