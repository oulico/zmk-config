# Core Bluetooth settings
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split keyboard support
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

# Mouse/Pointing device support
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE_WORK_QUEUE_DEDICATED=y

# Mouse speed settings (maximum values)
CONFIG_ZMK_MOUSE_TICK_DURATION=8
CONFIG_INPUT_LISTENER_PERIOD=8

# Connection stability improvements
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Settings persistence
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=30000

# Combo support
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

# Performance optimization for homerow mods
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
